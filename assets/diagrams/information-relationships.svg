<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="group" aria-labelledby="relationships-title relationships-desc" class="relationship-svg">
  <title id="relationships-title">Relationships between maintained information</title>
  <desc id="relationships-desc">A handbook includes the access and equipment procedures. Both procedures refer to a security policy. Arrows identify relationships, not task order.</desc>
  <defs><marker id="relationship-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="context-stroke"/></marker></defs>
  <g font-family="system-ui,sans-serif" fill="#27312a">
    <g class="relationship-edge" data-from="handbook" data-to="access">
      <path d="M100 230V110H376" fill="none" stroke="#64715e" stroke-width="3" marker-end="url(#relationship-arrow)"/>
      <text x="240" y="88" font-size="30" text-anchor="middle">includes</text>
    </g>
    <g class="relationship-edge" data-from="handbook" data-to="equipment">
      <path d="M100 370V490H376" fill="none" stroke="#64715e" stroke-width="3" marker-end="url(#relationship-arrow)"/>
      <text x="240" y="468" font-size="30" text-anchor="middle">includes</text>
    </g>
    <g class="relationship-edge" data-from="access" data-to="policy">
      <path d="M580 110H860V226" fill="none" stroke="#64715e" stroke-width="3" marker-end="url(#relationship-arrow)"/>
      <text x="720" y="88" font-size="30" text-anchor="middle">refers to</text>
    </g>
    <g class="relationship-edge" data-from="equipment" data-to="policy">
      <path d="M580 490H860V374" fill="none" stroke="#64715e" stroke-width="3" marker-end="url(#relationship-arrow)"/>
      <text x="720" y="468" font-size="30" text-anchor="middle">refers to</text>
    </g>
    <g class="relationship-node" data-node="handbook" role="button" tabindex="0" aria-label="Handbook" text-anchor="middle">
      <title>Handbook includes the access and equipment procedures</title>
      <rect x="10" y="230" width="180" height="140" rx="8" fill="#edf2e9" stroke="#829173" stroke-width="2"/>
      <text x="100" y="310" font-size="32">Handbook</text>
    </g>
    <g class="relationship-node" data-node="access" role="button" tabindex="0" aria-label="Access, PROC-001" text-anchor="middle">
      <title>Access is included in the handbook and refers to the security policy</title>
      <rect x="380" y="40" width="200" height="140" rx="8" fill="#f6f1e5" stroke="#ab945c" stroke-width="2"/>
      <text x="480" y="100" font-size="32">Access</text><text x="480" y="136" font-size="24">PROC-001</text>
    </g>
    <g class="relationship-node" data-node="equipment" role="button" tabindex="0" aria-label="Equipment, PROC-002" text-anchor="middle">
      <title>Equipment is included in the handbook and refers to the security policy</title>
      <rect x="380" y="420" width="200" height="140" rx="8" fill="#f6f1e5" stroke="#ab945c" stroke-width="2"/>
      <text x="480" y="480" font-size="32">Equipment</text><text x="480" y="516" font-size="24">PROC-002</text>
    </g>
    <g class="relationship-node" data-node="policy" role="button" tabindex="0" aria-label="Security policy, POL-001" text-anchor="middle">
      <title>Both procedures refer to the security policy</title>
      <rect x="770" y="230" width="180" height="140" rx="8" fill="#f0edf4" stroke="#9583a3" stroke-width="2"/>
      <text x="860" y="276" font-size="30">Security</text><text x="860" y="310" font-size="30">policy</text><text x="860" y="344" font-size="24">POL-001</text>
    </g>
  </g>
</svg>
