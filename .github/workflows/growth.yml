name: Measure project growth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/measure_growth.py
      - uses: actions/upload-artifact@v7
        with:
          name: project-growth
          path: |
            build/growth/history.json
            build/growth/*.png
