name: PDF design proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Render Mermaid and build PDF proof
    # Keep Chromium's sandbox enabled on this supported runner image.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publishing/pdf/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: publishing/pdf/requirements.txt
      - name: Install PDF tools
        run: |
          python -m pip install -r publishing/pdf/requirements.txt
          npm ci --prefix publishing/pdf --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-liberation
      - name: Install Puppeteer's compatible browser
        working-directory: publishing/pdf
        run: |
          ./node_modules/.bin/puppeteer browsers install chrome
          node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(`PUPPETEER_EXECUTABLE_PATH=${await puppeteer.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Test source processing
        run: python -m unittest discover -s publishing/pdf -p 'test_*.py'
      - name: Render Mermaid and build PDF
        run: python scripts/build_pdf_proof.py
      - name: Verify generated SVG and PDF
        run: python scripts/verify_pdf_proof.py
      - name: Render pages for human review
        run: pdftoppm -scale-to 1600 -png build/pdf-proof/document-as-code-proof.pdf build/pdf-proof/page
      - name: Upload review artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdf-design-proof-${{ github.sha }}
          path: |
            build/pdf-proof/document-as-code-proof.pdf
            build/pdf-proof/onboarding.svg
            build/pdf-proof/manifest.json
            build/pdf-proof/verification.json
            build/pdf-proof/page-*.png
          if-no-files-found: error
          retention-days: 14
