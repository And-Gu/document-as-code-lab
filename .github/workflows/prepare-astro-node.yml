# Temporary one-shot workflow. Regenerate package lock under Node 24; remove before merge.
name: Prepare Node 24 compatible site dependencies
on:
  push:
    branches: [fix/astro-security-nov2026]
    paths: [.github/workflows/prepare-astro-node.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Remove shadowing local Node executable and update lockfile
        working-directory: site
        run: |
          npm pkg delete devDependencies.node
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package.json site/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: use runner Node 24 and remove shadowing npm Node dependency"
            git push origin HEAD:fix/astro-security-nov2026
          fi
