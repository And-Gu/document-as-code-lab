name: Astro PR check

on:
  pull_request:
    branches: [main, feat/audience-and-reader-experience, feat/information-refinement-lab]

permissions:
  contents: read

concurrency:
  group: astro-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r ../requirements.txt
      - run: npm run test:dashboard
      - run: npm run check
      - run: npm run build
      - run: npm run test:learning
      - run: npm run test:content
      - run: npm run test:homepage
      - run: npm run test:refinement
      - run: npm run test:contracts
      - run: node scripts/test-budget.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reader-journey-evidence
          path: build/verification/
          retention-days: 14
