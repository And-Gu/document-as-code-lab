name: Astro PR check

on:
  pull_request:
    branches: [main, feat/audience-and-reader-experience, feat/information-refinement-lab]

permissions:
  contents: read

concurrency:
  group: astro-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Classify change impact
        id: impact
        run: node scripts/ci-impact.mjs --ci
      - run: npm ci
      - name: Restore incremental page cache for this PR
        uses: actions/cache@v6
        with:
          path: site/node_modules/.astro
          key: astro-pr-${{ runner.os }}-${{ github.event.pull_request.number }}-${{ hashFiles('site/package-lock.json', 'site/astro.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            astro-pr-${{ runner.os }}-${{ github.event.pull_request.number }}-${{ hashFiles('site/package-lock.json', 'site/astro.config.mjs') }}-
      - run: npm audit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r ../requirements.txt
      - run: python -m unittest discover -s tests
        working-directory: .
      - run: npm run preflight
      - run: npm run test:tooling
      - run: npm run test:dashboard
      - run: npm run test:scheduled-publish
      - run: npm run test:incremental
      - run: npm run check
      - run: npm run build -- --timings
      - run: npm run test:learning
      - run: npm run test:content
      - run: npm run test:homepage
      - run: npm run test:curriculum
      - run: npm run test:verification
      - run: npm run test:refinement
      - run: npm run test:contracts
      - run: node scripts/test-budget.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify affected browser journeys
        env:
          BROWSER_ARGS: ${{ steps.impact.outputs.browser_args }}
        run: npm run test:e2e -- $BROWSER_ARGS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reader-journey-evidence
          path: build/verification/
          retention-days: 14
