name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      started_at: ${{ steps.start.outputs.started_at }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Record build start for snapshot freshness verification
        id: start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: site
          node-version: '24'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify published revision and reader routes
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosted
        env:
          HOSTED_URL: https://and-gu.github.io/document-as-code-lab/
          EXPECTED_REVISION: ${{ github.sha }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: hosted-reader-verification-${{ github.sha }}
          path: build/verification/
          retention-days: 14

  verify-scheduled:
    name: Verify scheduled dashboard publication
    needs: [build, deploy]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check published revision, dashboard and fresh snapshot
        run: node scripts/verify-scheduled-publication.mjs
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          BUILD_STARTED_AT: ${{ needs.build.outputs.started_at }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
